sentence=Um DAP (tocador de audio) para a ESP32-S3: MP3, FLAC, WAV, AIFF, OGG e DSD do cartao microSD e do pendrive USB.
paragraph=Biblioteca por artista, album, genero, artista do album, ano, compositor e pasta; playlists, favoritas, equalizador de 5 faixas e os modos de reproducao. Tela ILI9341 240x320, roda KY-040, cinco botoes e saida I2S (MAX98357A ou PCM5102A). Precisa de PSRAM (ESP32-S3 N8R8). Decodificadores dr_libs e stb_vorbis (dominio publico), fonte Noto Sans (OFL) e icones Material Icons (Apache 2.0): veja LICENCAS.txt.
